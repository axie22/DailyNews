name: worker

# Deploys the Cloudflare Worker that answers 👍/👎 taps instantly and runs the hourly
# schedule, then points the Telegram bot at it. Re-run any time; it's idempotent.
#
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DISPATCH_TOKEN
# (plus TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, STATE_KEY, which you already have).
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy = install/update the Worker; disable = point Telegram back to polling
        type: choice
        options: [deploy, disable]
        default: deploy
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      KV_TITLE: dailynews-taps
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=()
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID STATE_KEY; do [[ -n "${!v}" ]] || missing+=("$v"); done
          if [[ "${{ inputs.action }}" != "disable" ]]; then
            for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISPATCH_TOKEN; do [[ -n "${!v}" ]] || missing+=("$v"); done
          fi
          if (( ${#missing[@]} )); then
            # On push before setup is finished, skip quietly instead of failing every commit.
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "::notice title=worker::skipped — secrets not set yet: ${missing[*]}"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
            fi
            echo "::error title=worker::missing repo secrets: ${missing[*]}"; exit 1
          fi

      - name: Disable (back to polling)
        if: inputs.action == 'disable'
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" -d drop_pending_updates=false
          echo "::notice title=worker::webhook removed — the pipeline is back to reading taps via getUpdates"
          echo "SKIP=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Install and test
        if: env.SKIP != '1'
        working-directory: worker
        run: npm ci --no-audit --no-fund && npm test

      - name: Derive shared secrets
        if: env.SKIP != '1'
        run: |
          pip install -q .
          for p in webhook pull; do
            v=$(python -m dailynews.derived "$p"); echo "::add-mask::$v"
            echo "${p^^}_SECRET=$v" >> "$GITHUB_ENV"
          done

      - name: Ensure KV namespace
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | python3 -c "
          import json, os, sys
          raw = sys.stdin.read(); raw = raw[raw.find('['): raw.rfind(']') + 1] or '[]'   # tolerate banners
          print(next((n['id'] for n in json.loads(raw) if n.get('title') == os.environ['KV_TITLE']), ''))"
          }
          id=$(find_id)
          if [[ -z "$id" ]]; then npx wrangler kv namespace create "$KV_TITLE" >/dev/null; id=$(find_id); fi
          [[ -n "$id" ]] || { echo "::error title=worker::could not create or find KV namespace $KV_TITLE"; exit 1; }
          sed -i "s/__KV_ID__/$id/" wrangler.toml
          echo "KV namespace: $id"

      - name: Deploy
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          npx wrangler deploy --var "GITHUB_REPO:${{ github.repository }}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [[ -n "$url" ]] || { echo "::error title=worker::no workers.dev URL in deploy output. New Cloudflare accounts must open Workers & Pages once to pick a workers.dev subdomain."; exit 1; }
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Set Worker secrets
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          python3 - > secrets.json <<'PY'
          import json, os
          print(json.dumps({
              "TELEGRAM_BOT_TOKEN": os.environ["TELEGRAM_BOT_TOKEN"].strip(),
              "TELEGRAM_CHAT_ID": os.environ["TELEGRAM_CHAT_ID"].strip(),
              "WEBHOOK_SECRET": os.environ["WEBHOOK_SECRET"],
              "PULL_TOKEN": os.environ["PULL_SECRET"],
              "GITHUB_TOKEN": os.environ["DISPATCH_TOKEN"].strip(),
          }))
          PY
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Health check
        if: env.SKIP != '1'
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "$WORKER_URL/health" || true)
            echo "$body" | grep -q '"ok":true' && { echo "$body"; exit 0; }
            sleep 5
          done
          echo "::error title=worker::health check failed: $body"; exit 1

      - name: Point Telegram at the Worker
        if: env.SKIP != '1'
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            -d "{\"url\": \"${WORKER_URL}/telegram\", \"secret_token\": \"${WEBHOOK_SECRET}\", \"allowed_updates\": [\"callback_query\"], \"drop_pending_updates\": false}" \
            | grep -q '"ok":true'
          info=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$info" | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; print(f\"::notice title=worker::live at {r['url'].rsplit('/telegram',1)[0]} — taps now answer instantly; hourly runs start at :23. pending={r.get('pending_update_count')}\")"
