name: review-export
# One-off, encrypted export of recently delivered items for review. Safe to delete.
on:
  push:
    branches: [review-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore state (read-only — never pushed back)
        run: scripts/state.sh pull
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - run: python3 scripts/review_export.py 8
