[project]
name = "ml-news-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "httpx",
  "feedparser",
  "beautifulsoup4",
  "lxml",
  "apscheduler>=3.10",
  "pydantic-settings",
  "tenacity",
  "tweepy>=4.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
