# Deployed by .github/workflows/worker-deploy.yml — KV id is filled in at deploy time.
name = "dailynews"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
GITHUB_WORKFLOW = "dailynews.yml"
GITHUB_REF = "main"
# GITHUB_REPO is injected at deploy time from the repository running the workflow.

[[kv_namespaces]]
binding = "TAPS"
id = "__KV_ID__"

[triggers]
# Hourly at :23 — kicks the GitHub workflow on time (GitHub's own cron drifts by hours).
crons = ["23 * * * *"]

[observability]
enabled = true
