# Source registry. `group` drives diversity caps and a learned per-source preference.
# `lab` (optional) marks items as frontier-lab priority. `min_interval_hours`
# throttles how often a source is polled even though the workflow runs hourly.
#
# verified = confirmed to return a feed/listing when this file was written (2026-10-14).

rss:
  - {key: openai,          url: "https://openai.com/news/rss.xml",              lab: openai,    group: lab}       # verified
  - {key: deepmind,        url: "https://deepmind.google/blog/rss.xml",         lab: google,    group: lab}       # verified
  - {key: google_research, url: "https://research.google/blog/rss/",            lab: google,    group: lab}       # verified
  - {key: google_ai_blog,  url: "https://blog.google/technology/ai/rss/",       lab: google,    group: lab}
  - {key: alignment_forum, url: "https://www.alignmentforum.org/feed.xml?view=curated-rss", group: community}
  - {key: bair,            url: "https://bair.berkeley.edu/blog/feed.xml",      group: community}
  # Alignment (curated only: the full LessWrong feed is dozens of mostly non-AI posts a day).
  # Alignment Forum posts are cross-posted here; same-title clustering shows each once.
  - {key: lesswrong,       url: "https://www.lesswrong.com/feed.xml?view=curated-rss", group: community}  # verified 2026-10-22
  # Pretraining / post-training / architectures
  - {key: interconnects,   url: "https://www.interconnects.ai/feed",            group: blog}  # verified 2026-10-22
  - {key: ahead_of_ai,     url: "https://magazine.sebastianraschka.com/feed",   group: blog}  # verified 2026-10-22
  - {key: lilian_weng,     url: "https://lilianweng.github.io/index.xml",       group: blog}  # verified 2026-10-22
  - {key: hf_blog,         url: "https://huggingface.co/blog/feed.xml",         group: community}  # verified 2026-10-22
  # Math & theory (hand-picked writers). Unverified URLs are checked by `doctor` before merge.
  - {key: francis_bach,    url: "https://francisbach.com/feed/",                group: blog}
  - {key: argmin,          url: "https://www.argmin.net/feed",                  group: blog}
  - {key: terry_tao,       url: "https://terrytao.wordpress.com/feed/",         group: blog}
  - {key: quanta,          url: "https://www.quantamagazine.org/feed/",         group: community}
  # Week's top posts, read every other day; already-seen posts are skipped.
  - {key: reddit_ml,       url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=week", group: community}

# Sites with no RSS feed: their listing pages are scraped (fragile — watch the digest's health footer).
pages:
  - {key: anthropic_news,     url: "https://www.anthropic.com/news",     lab: anthropic, group: lab}  # verified
  - {key: anthropic_research, url: "https://www.anthropic.com/research", lab: anthropic, group: lab}
  # Goodfire (interpretability). Treated as priority like the frontier labs.
  - {key: goodfire_blog,      url: "https://www.goodfire.com/blog",      lab: goodfire,  group: lab}  # verified 2026-10-19
  - {key: goodfire_research,  url: "https://www.goodfire.com/research",  lab: goodfire,  group: lab}
  # Thinking Machines Lab (post-training research, e.g. on-policy distillation). No feed.
  - {key: thinking_machines,  url: "https://thinkingmachines.ai/blog",   lab: thinking_machines, group: lab, min_interval_hours: 6}

# Newest model repos per org on the Hugging Face Hub (catches open-weight releases with no blog post).
hf_models:
  min_interval_hours: 3
  per_org: 25
  # Orgs that upload constantly need some community traction before an upload counts.
  min_likes:
    nvidia: 15
    google: 5
  orgs:
    meta-llama: meta
    google: google
    mistralai: mistral
    deepseek-ai: deepseek
    Qwen: qwen
    nvidia: nvidia
    openai: openai
    xai-org: xai

hf_papers:
  days: 3              # one request per day, so an every-other-day sweep misses nothing
  # HF Daily Papers orgs that count as frontier labs (paper.organization.name -> lab)
  org_labs:
    google: google
    deepmind: google
    google-deepmind: google
    openai: openai
    anthropic: anthropic
    facebook: meta
    meta-llama: meta
    nvidia: nvidia
    Qwen: qwen
    deepseek-ai: deepseek
    mistralai: mistral

arxiv:
  # stat.ML, math.OC (optimization) and math.ST (statistics theory) for training/optimization/math;
  # off-topic papers in those (e.g. control theory) are tagged by Jev and ranked out.
  query: "cat:cs.LG OR cat:cs.AI OR cat:cs.CL OR cat:stat.ML OR cat:math.OC OR cat:math.ST"
  max_results: 2000    # ~2 days across these categories; paged 500 at a time
  page_size: 500
  lookback_days: 3
